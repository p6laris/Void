name = "Catppuccin Latte"

[palette]
rosewater = "#dc8a78"
flamingo = "#dd7878"
pink = "#ea76cb"
mauve = "#8839ef"
red = "#d20f39"
maroon = "#e64553"
peach = "#fe640b"
yellow = "#df8e1d"
green = "#40a02b"
teal = "#179299"
sky = "#04a5e5"
sapphire = "#209fb5"
blue = "#1e66f5"
lavender = "#7287fd"
text = "#4c4f69"
subtext1 = "#5c5f77"
subtext0 = "#6c6f85"
overlay2 = "#7c7f93"
overlay1 = "#8c8fa1"
overlay0 = "#9ca0b0"
surface2 = "#acb0be"
surface1 = "#bcc0cc"
surface0 = "#ccd0da"
base = "#eff1f5"
mantle = "#e6e9ef"
crust = "#dce0e8"

[tokens]
bg = "base"
text = "text"
dim = "overlay0"
accent = "blue"
on_accent = "crust"
success = "green"
warning = "yellow"
error = "red"
info = "mauve"
progress_dim = "surface0"
task_track = "surface1"
panel = "mantle"
panel_border = "surface2"
select_bg = "surface1"
select_fg = "text"
active_bg = "surface0"
active_fg = "blue"

# ── Optional tokens ──────────────────────────────────────────────────────────
# Everything below is derived from the tokens above when omitted, so a theme file
# never breaks when Void adds a token. Uncomment to override.
#
# comment     = "surface1"   # `//` annotation lines; quieter than `dim`
# surface     = "mantle"     # raised background for insets and zebra rows
# surface_alt = "surface0"   # second elevation
#
# Activity heatmap ramp — one hue rising in intensity, never a hue change.
# Derived as bg blended toward `accent` in rising steps.
# heat_0 = "surface0"        # no activity
# heat_1 = "#b9c8e8"
# heat_2 = "#8ba6d8"
# heat_3 = "#5d85c8"
# heat_4 = "blue"            # most active
#
# Per-timer-mode accents; override to tint breaks without touching `warning`.
# mode_focus       = "blue"
# mode_short_break = "green"
# mode_long_break  = "peach"
# mode_custom      = "mauve"
