name = "Catppuccin Mocha"

# Catppuccin palette — https://github.com/catppuccin/catppuccin
[palette]
rosewater = "#f5e0dc"
flamingo = "#f2cdcd"
pink = "#f5c2e7"
mauve = "#cba6f7"
red = "#f38ba8"
maroon = "#eba0ac"
peach = "#fab387"
yellow = "#f9e2af"
green = "#a6e3a1"
teal = "#94e2d5"
sky = "#89dceb"
sapphire = "#74c7ec"
blue = "#89b6fa"
lavender = "#b4befe"
text = "#cdd6f4"
subtext1 = "#bac2de"
subtext0 = "#a6adc8"
overlay2 = "#9399b2"
overlay1 = "#7f849c"
overlay0 = "#6c7086"
surface2 = "#585b70"
surface1 = "#45475a"
surface0 = "#313244"
base = "#1e1e2e"
mantle = "#181825"
crust = "#11111b"

# Void semantic tokens — values may be hex colors or [palette] keys above.
[tokens]
bg = "base"
text = "text"
dim = "overlay0"
accent = "blue"
on_accent = "crust"
success = "green"
warning = "yellow"
error = "red"
info = "mauve"
progress_dim = "surface0"
task_track = "surface1"
panel = "mantle"
panel_border = "surface2"
select_bg = "surface1"
select_fg = "text"
active_bg = "surface0"
active_fg = "blue"

# ── Optional tokens ──────────────────────────────────────────────────────────
# Everything below is derived from the tokens above when omitted, so a theme file
# never breaks when Void adds a token. Uncomment to override.
#
# comment     = "surface1"   # `//` annotation lines; quieter than `dim`
# surface     = "mantle"     # raised background for insets and zebra rows
# surface_alt = "surface0"   # second elevation
#
# Activity heatmap ramp — one hue rising in intensity, never a hue change.
# Derived as bg blended toward `accent` in rising steps.
# heat_0 = "surface0"        # no activity
# heat_1 = "#3c4a68"
# heat_2 = "#546a94"
# heat_3 = "#6e8fc6"
# heat_4 = "blue"            # most active
#
# Per-timer-mode accents; override to tint breaks without touching `warning`.
# mode_focus       = "blue"
# mode_short_break = "green"
# mode_long_break  = "peach"
# mode_custom      = "mauve"
